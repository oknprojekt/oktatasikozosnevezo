<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oktatási Közös Nevező</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #1a1a1a;
        line-height: 1.6;
    }

    .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 60px 24px;
        text-align: center;
    }

    .logo {
        max-width: 220px;
        height: auto;
        margin-bottom: 40px;
    }

    h1 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 20px;
    }

    p.lead {
        font-size: 18px;
        color: #444;
        margin-bottom: 40px;
    }

    .button {
        display: inline-block;
        padding: 14px 28px;
        background-color: #111;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        transition: background-color 0.2s ease;
    }

    .button:hover {
        background-color: #333;
    }

    .section {
        margin-top: 80px;
        text-align: left;
    }

    .section h2 {
        font-size: 20px;
        margin-bottom: 16px;
    }

    .podcast-links a {
        display: block;
        margin-bottom: 8px;
        color: #000;
        text-decoration: none;
    }

    .podcast-links a:hover {
        text-decoration: underline;
    }

    footer {
        margin-top: 80px;
        font-size: 14px;
        color: #666;
        text-align: center;
    }

    @media (max-width: 600px) {
        .container {
            padding: 40px 20px;
        }

        h1 {
            font-size: 26px;
        }

        p.lead {
            font-size: 16px;
        }
    }
</style>

</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="assets/OKN-logo.png" alt="OKN logó" class="logo">

    <!-- CÍM -->
    <h1>Oktatási Közös Nevező</h1>

    <!-- LEÍRÁS -->
    <p class="lead">
        Civil kezdeményezés a magyar oktatási rendszer állampolgári
        visszajelzéseinek rendszerszintű összegzésére.
    </p>

    <!-- LETÖLTÉS -->
    <a href="#" class="button">Dokumentum letöltése hamarosan</a>

    <!-- PODCAST SZEKCIÓ -->
<!-- VIDEÓK / PODCAST SZEKCIÓ -->
    <section style="max-width:900px;margin:60px auto;padding:0 20px;">
      
      <h2 style="font-size:28px;margin-bottom:20px;text-align:center;">
        Kapcsolódó videók és podcast beszélgetések
      </h2>
    
      <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.08);">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLmsZZfz7tYrUqrTejp7OeejeBYUjj86Oj"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          style="position:absolute;top:0;left:0;width:100%;height:100%;">
        </iframe>
      </div>
    
    </section>


    <!-- KAPCSOLAT -->
    <div class="section">
        <h2>Kapcsolat</h2>
        <p>
            magyaroktatas@proton.me
        </p>
    </div>

    <footer>
        © 2026 Oktatási Közös Nevező
    </footer>

</div>

</body>
</html>
