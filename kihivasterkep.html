<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<title>Kihívástérkép – Oktatási Közös Nevező</title>

<style>
  body{ margin:0; font-family:'Inter',sans-serif; background:#fff; color:#222; }
  header{ max-width:900px; margin:0 auto; padding:18px 20px 10px; text-align:center; }
  header h1{ margin:0; font-size:18px; font-weight:700; letter-spacing:.5px; }
  header .sub{ margin-top:8px; font-size:13px; color:#555; line-height:1.35; }
  .top-actions{
    max-width:900px; margin:0 auto; padding:0 20px 12px;
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  }
  .top-actions a{ font-size:13px; text-decoration:none; color:#8b0000; font-weight:600; }
  .top-actions a:hover{ color:#b00000; }

  #viewer{
    width:100%;
    height: calc(100vh - 120px);
    background:#fff;
    border-top:1px solid #e5e5e5;
    border-bottom:1px solid #e5e5e5;
  }

  @media (max-width:600px){
    #viewer{ height: calc(100vh - 140px); }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

<header>
  <h1>Kihívástérkép</h1>
  <div class="sub">Pinch-zoom és húzás mobilon is. (Ha a mobil böngésző “oldal zoomot” erőltetne, próbáld két ujjal a térképet.)</div>
</header>

<div class="top-actions">
  <a href="index.html">← Vissza a főoldalra</a>
</div>

<div id="viewer"></div>

<script>
  OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
    tileSources: {
      type: "image",
      url: "kihivasterkep/map.svg"   // <-- ide tedd az SVG-t
    },

    showNavigationControl: true,

    // mobil pinch/húzás
    gestureSettingsTouch: {
      pinchToZoom: true,
      flickEnabled: true,
      dragToPan: true,
      dblClickToZoom: true
    },

    // asztali
    gestureSettingsMouse: {
      scrollToZoom: true,
      clickToZoom: true,
      dblClickToZoom: true,
      dragToPan: true
    },

    // ésszerű korlátok
    minZoomLevel: 0.6,
    maxZoomPixelRatio: 3
  });
</script>

</body>
</html>
