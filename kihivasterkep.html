<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<title>Kihívástérkép – Oktatási Közös Nevező</title>

<style>
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#fff;
    color:#222;
    line-height:1.6;
  }
  header{
    max-width:900px;
    margin:0 auto;
    padding:20px 20px 10px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header .sub{
    margin-top:8px;
    font-size:13px;
    color:#555;
  }
  .top-actions{
    max-width:900px;
    margin:0 auto;
    padding:0 20px 12px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .top-actions a{
    font-size:13px;
    text-decoration:none;
    color:#8b0000;
    font-weight:600;
  }
  .top-actions a:hover{ color:#b00000; }

  #viewer{
    width:100%;
    height: calc(100vh - 140px);
    background:#fff;
    border-top:1px solid #e5e5e5;
    border-bottom:1px solid #e5e5e5;
  }
  @media (max-width:600px){
    #viewer{ height: calc(100vh - 160px); }
  }

  #viewer-error{
    display:none;
    max-width:900px;
    margin:16px auto 0;
    padding:0 20px;
    font-size:13px;
    color:#8b0000;
    text-align:center;
    font-weight:600;
  }
 
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

<header>
  <h1>Kihívástérkép</h1>
  <div class="sub">Nagyíts, húzd, és böngészd a térképet (mobilon is).</div>
</header>

<div class="top-actions">
  <a href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    Vissza a főoldalra
  </a>

  <a href="assets/kihivasterkep.png" download="kihivasterkep.png">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 16l-6-6h4V4h4v6h4z"/>
    </svg>
    Kihívástérkép letöltése
  </a>
</div>

<div id="viewer"></div>
<div id="viewer-error"></div>

<script>
  // ====== Beállítások (ezek nálad adottak) ======
  const TILE_BASE = "kihivasterkep/map_files/"; // itt vannak a csempék
  const WIDTH = 9928;
  const HEIGHT = 9848;
  const TILE_SIZE = 256;
  const OVERLAP = 0;

  const errorEl = document.getElementById('viewer-error');

  function showError(msg){
    errorEl.style.display = 'block';
    errorEl.textContent = msg;
  }

  function setHint(msg){/*hint kikapcsolva*/}

  function tryLoadImage(url){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => reject(false);
      // cache-busting, hogy biztosan a frisset nézze
      img.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
    });
  }

  async function detectTileFormat(){
    // A legkisebb szintnél (0) biztosan van 0_0
    const candidates = ["png", "jpeg", "jpg"];
    for (const ext of candidates){
      const testUrl = `${TILE_BASE}0/0_0.${ext}`;
      try{
        await tryLoadImage(testUrl);
        return ext;
      }catch(e){
        // próbáljuk a következőt
      }
    }
    return null;
  }

  function initViewer(formatExt){

    OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
      showNavigationControl: true,
      zoomPerScroll: 1.2,
      minZoomLevel: 0.6,
      maxZoomPixelRatio: 2,
      gestureSettingsTouch: {
        pinchToZoom: true,
        flickEnabled: true
      },

      // DeepZoom descriptor objektumból (nem .dzi fájlból)
      tileSources: {
        Image: {
          xmlns: "http://schemas.microsoft.com/deepzoom/2008",
          Url: TILE_BASE,          // fontos: perjellel a végén (nálunk így van)
          Format: formatExt,       // png / jpeg / jpg (auto-detekttel)
          Overlap: String(OVERLAP),
          TileSize: String(TILE_SIZE),
          Size: { Width: WIDTH, Height: HEIGHT }
        }
      }
    });
  }

  (async function boot(){
    if (!window.OpenSeadragon){
      showError("Nem töltődött be az OpenSeadragon könyvtár (CDN hiba).");
      return;
    }

    const ext = await detectTileFormat();
    if (!ext){
      showError(
        "Nem találok csempét a megadott útvonalon. Ellenőrizd, hogy létezik-e pl.: " +
        `"${TILE_BASE}0/0_0.png" vagy ".jpeg" / ".jpg".`
      );
      return;
    }

    initViewer(ext);
  })();
</script>

</body>
</html>
