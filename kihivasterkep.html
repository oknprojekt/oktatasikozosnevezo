<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Kihívástérkép – Oktatási Közös Nevező</title>

  <style>
    body{
      margin:0;
      font-family:'Inter', sans-serif;
      background:#fff;
      color:#222;
      line-height:1.6;
    }
    header{
      max-width:900px;
      margin:0 auto;
      padding:20px 20px 10px;
      text-align:center;
    }
    header h1{
      margin:0;
      font-size:18px;
      font-weight:700;
      letter-spacing:0.5px;
    }
    header .sub{
      margin-top:8px;
      font-size:13px;
      color:#555;
    }
    .top-actions{
      max-width:900px;
      margin:0 auto;
      padding:0 20px 12px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .top-actions a{
      font-size:13px;
      text-decoration:none;
      color:#8b0000;
      font-weight:600;
    }
    .top-actions a:hover{ color:#b00000; }

    /* Viewer */
    #viewer{
      width:100%;
      height: calc(100vh - 140px);
      border-top:1px solid #e5e5e5;
      border-bottom:1px solid #e5e5e5;
      overflow:hidden;
      position:relative;
      touch-action:none; /* fontos: pinch/pan a viewerben */
      background:#fff;
    }

    /* az SVG elem */
    #viewer svg{
      width:100%;
      height:100%;
      display:block;
    }

    @media (max-width:600px){
      #viewer{ height: calc(100vh - 160px); }
    }

    #err{
      display:none;
      max-width:900px;
      margin:16px auto 0;
      padding:0 20px;
      font-size:13px;
      color:#8b0000;
      text-align:center;
      font-weight:600;
    }
  </style>

  <!-- svg-pan-zoom (kicsi, bevált) -->
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>

<body>
  <header>
    <h1>Kihívástérkép</h1>
    <div class="sub">Nagyíts, húzd, és böngészd a térképet (mobilon is).</div>
  </header>

  <div class="top-actions">
    <a href="index.html">← Vissza a főoldalra</a>
    <a href="kihivasterkep/map.svg" target="_blank" rel="noopener">SVG megnyitása</a>
  </div>

  <div id="viewer"></div>
  <div id="err">Nem töltődött be a térkép. Ellenőrizd, hogy létezik-e: <code>kihivasterkep/map.svg</code></div>

  <script>
    // Betöltjük az SVG-t inline, hogy tudjuk pan-zoomolni
    fetch('kihivasterkep/map.svg', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(svgText => {
        const viewer = document.getElementById('viewer');
        viewer.innerHTML = svgText;

        const svgEl = viewer.querySelector('svg');
        if (!svgEl) throw new Error('No <svg> root found');

        // Pan/zoom init
        window.__oknSvgPanZoom = svgPanZoom(svgEl, {
          zoomEnabled: true,
          controlIconsEnabled: true,
          fit: true,
          center: true,
          minZoom: 0.5,
          maxZoom: 20,
          zoomScaleSensitivity: 0.25
        });
      })
      .catch(() => {
        document.getElementById('err').style.display = 'block';
      });
  </script>
</body>
</html>
