<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<title>Kihívástérkép – Oktatási Közös Nevező</title>

<style>
  body{ margin:0; font-family:'Inter',sans-serif; background:#fff; color:#222; }
  header{ max-width:900px; margin:0 auto; padding:18px 20px 10px; text-align:center; }
  header h1{ margin:0; font-size:18px; font-weight:700; letter-spacing:.5px; }
  header .sub{ margin-top:8px; font-size:13px; color:#555; line-height:1.35; }
  .top-actions{
    max-width:900px; margin:0 auto; padding:0 20px 12px;
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  }
  .top-actions a{ font-size:13px; text-decoration:none; color:#8b0000; font-weight:600; }
  .top-actions a:hover{ color:#b00000; }

  /* viewer */
  #viewer{
    width:100%;
    height: calc(100vh - 120px);
    border-top:1px solid #e5e5e5;
    border-bottom:1px solid #e5e5e5;
    background:#fff;
    overflow:hidden;
    touch-action:none; /* fontos a pinch-hez */
  }

  /* a betöltött SVG-t rugalmasan kezeljük */
  #viewer svg{
    width:100%;
    height:100%;
    display:block;
  }

  /* finom hibaszöveg */
  #err{
    display:none;
    padding:14px 20px;
    max-width:900px;
    margin:0 auto;
    color:#8b0000;
    font-size:13px;
    font-weight:600;
    text-align:center;
  }

  @media (max-width:600px){
    #viewer{ height: calc(100vh - 140px); }
  }
</style>

<!-- Hammer.js (touch/pinch) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- svg-pan-zoom -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg-pan-zoom/3.6.1/svg-pan-zoom.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

<header>
  <h1>Kihívástérkép</h1>
  <div class="sub">Pinch-zoom és húzás mobilon is – vektorosan, élesen.</div>
</header>

<div class="top-actions">
  <a href="index.html">← Vissza a főoldalra</a>
</div>

<div id="viewer" aria-label="Kihívástérkép nézet"></div>
<div id="err">Nem töltődött be a map.svg. Ellenőrizd: <code>kihivasterkep/map.svg</code></div>

<script>
  // 1) SVG betöltése fetch-csel (így közvetlenül DOM-ba tesszük, nem <object>-tel)
  fetch('kihivasterkep/map.svg', { cache: 'no-store' })
    .then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(svgText => {
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = svgText;

      const svgEl = viewer.querySelector('svg');
      if(!svgEl) throw new Error('SVG tag not found');

      // 2) svg-pan-zoom inicializálás (vektoros, éles)
      const panZoom = svgPanZoom(svgEl, {
        zoomEnabled: true,
        controlIconsEnabled: true, // + / - ikonok (maradhat, de pinch is lesz)
        fit: true,
        center: true,
        minZoom: 0.2,
        maxZoom: 20,
        zoomScaleSensitivity: 0.25,
        preventMouseEventsDefault: true
      });

      // 3) Touch/pinch handler Hammer.js-szel (ez adja a jó mobil UX-et)
      const hammer = new Hammer(viewer, {
        inputClass: Hammer.SUPPORT_POINTER_EVENTS ? Hammer.PointerEventInput : Hammer.TouchInput
      });

      hammer.get('pinch').set({ enable: true });
      hammer.get('pan').set({ direction: Hammer.DIRECTION_ALL });

      let initialScale = 1;

      hammer.on('pinchstart', function () {
        initialScale = panZoom.getZoom();
      });

      hammer.on('pinch', function (ev) {
        panZoom.zoomAtPoint(initialScale * ev.scale, ev.center);
      });

      hammer.on('pan', function (ev) {
        // Hammer pan delta cumulált: a panZoom relativePan-nek jó
        panZoom.panBy({ x: ev.deltaX - (hammer.__lastX || 0), y: ev.deltaY - (hammer.__lastY || 0) });
        hammer.__lastX = ev.deltaX;
        hammer.__lastY = ev.deltaY;
      });

      hammer.on('panend pancancel', function () {
        hammer.__lastX = 0;
        hammer.__lastY = 0;
      });

      // dupla tap zoom (opcionális, de szerethető)
      hammer.on('doubletap', function(ev){
        panZoom.zoomAtPoint(panZoom.getZoom() * 1.35, ev.center);
      });

      // reszponzív újrafit
      window.addEventListener('resize', function(){
        panZoom.resize();
        panZoom.fit();
        panZoom.center();
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById('err').style.display = 'block';
    });
</script>

</body>
</html>
