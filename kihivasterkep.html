<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<title>Kihívástérkép – Oktatási Közös Nevező</title>

<style>
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#fff;
    color:#222;
    line-height:1.6;
  }
  header{
    max-width:900px;
    margin:0 auto;
    padding:20px 20px 10px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header .sub{
    margin-top:8px;
    font-size:13px;
    color:#555;
  }
  .top-actions{
    max-width:900px;
    margin:0 auto;
    padding:0 20px 12px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .top-actions a{
    font-size:13px;
    text-decoration:none;
    color:#8b0000; /* mély vörös */
    font-weight:600;
  }
  .top-actions a:hover{ color:#b00000; }

  /* Viewer */
  #viewer{
    width:100%;
    height: calc(100vh - 140px);
    background:#fff;
    border-top:1px solid #e5e5e5;
    border-bottom:1px solid #e5e5e5;
  }

  @media (max-width:600px){
    #viewer{ height: calc(100vh - 160px); }
  }

  /* Hibaszöveg (ha kell) */
  #viewer-error{
    display:none;
    max-width:900px;
    margin:16px auto 0;
    padding:0 20px;
    font-size:13px;
    color:#8b0000;
    text-align:center;
    font-weight:600;
  }
</style>

<!-- OpenSeadragon (Deep Zoom viewer) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

<header>
  <h1>Kihívástérkép</h1>
  <div class="sub">Nagyíts, húzd, és böngészd a térképet (mobilon is).</div>
</header>

<div class="top-actions">
  <a href="index.html">← Vissza a főoldalra</a>
</div>

<div id="viewer"></div>
<div id="viewer-error">Nem töltődött be a térkép. Ellenőrizd, hogy a csempék elérhetők-e: <code>kihivasterkep/map_files/</code> alatt.</div>

<script>
  // Biztonsági ellenőrzés: betöltődött-e az OpenSeadragon?
  if (!window.OpenSeadragon) {
    document.getElementById('viewer-error').style.display = 'block';
  } else {
    OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",

      // >>> FONTOS: nem a map.dzi-t kérjük, hanem közvetlenül a tile-okat a map_files alól
      tileSources: {
        Image: {
          xmlns: "http://schemas.microsoft.com/deepzoom/2008",
          Url: "kihivasterkep/map_files/",
          Format: "jpg",
          Overlap: "0",
          TileSize: "256",
          Size: { Width: 9928, Height: 9848 }
        }
      },

      showNavigationControl: true,
      zoomPerScroll: 1.2,
      minZoomLevel: 0.6,
      maxZoomPixelRatio: 2,
      gestureSettingsTouch: {
        pinchToZoom: true,
        flickEnabled: true
      }
    });
  }
</script>

</body>
</html>
